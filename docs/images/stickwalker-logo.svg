      <path d="M462 500H570L462 608Z" fill="#effeff" opacity=".79"/>
    </g>
  </g>
  <!-- Native 96 x 64 LCD. Exact indexed source cells for Pineco frame 0,
       plains terrain and item icon. Zero glyph independently recovered from
       the original photograph. Every artwork coordinate below is an integer.
       Seam-free rendering: merged contours and exact nested tone regions;
       no expanded cells, strokes, filters, raster images or changed pixels.
       Native rendering maps each LCD cell to exactly 4 x 4 output pixels,
       with its origin at output pixel 456,456. This also remains integer-aligned
       at 125, 150, 175 and 200 percent zoom. Housing geometry is unchanged.
       LCD transforms are flattened exactly; inline crispEdges styling is scoped
       to the LCD paths. Native origin 499.8,503.7; one source cell is 4.4 units. -->
  <g id="lcd-pixels" shape-rendering="crispEdges">
