    <path d="M1104 778H1169" fill="none" stroke="#ededee" stroke-width="12" stroke-linecap="round"/>
  </g>
  <!-- Thick ink outline, bevel and warm inset face. -->
  <g id="housing">
    <rect x="141" y="386" width="930" height="518" rx="90" fill="url(#casing-rim)" stroke="#001321" stroke-width="22"/>
    <rect x="171" y="415" width="870" height="456" rx="63" fill="url(#casing-face)"/>
    <path d="M151 396H370L151 615Z" fill="url(#rim-glint)" clip-path="url(#casing-clip)"/>
    <path d="M151 811C151 849 165 871 189 883L172 865C158 849 155 831 151 811Z" fill="#b39a8d" opacity=".24"/>
  </g>
  <g id="blue-button">
    <rect x="282" y="523" width="81" height="271" rx="41" fill="#2d2523" opacity=".42"/>
    <rect x="267" y="512" width="72" height="257" rx="36" fill="url(#button)" stroke="#001321" stroke-width="12"/>
    <path d="M292 529C279 533 278 546 278 560V728C278 742 282 750 291 756" fill="none" stroke="#50caff" stroke-width="10" stroke-linecap="round" opacity=".75"/>
    <rect x="284" y="537" width="38" height="213" rx="19" fill="#1586e8"/>
    <path d="M288 538L295 532" stroke="#d5f6ff" stroke-width="14" stroke-linecap="round"/>
