  <title id="title">Pixel companion handheld</title>
  <desc id="description">A brown handheld with a blue button, pale LCD, pixel-art Pineco, three trees, a bag and a zero. Code-authored vectors; LCD cell artwork recovered from the original photograph and aligned to one 4.4-unit grid. Transparent background.</desc>
