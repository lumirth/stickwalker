<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1135" height="580" viewBox="110 355 1135 580" role="img" aria-labelledby="title description">
  <title id="title">Pixel companion handheld</title>
  <desc id="description">A brown handheld with a blue button, pale LCD, pixel-art Pineco, three trees, a bag and a zero. Code-authored vectors; native 96 by 64 LCD with source-exact Pineco, terrain and item pixels, and photograph-verified zero glyph on one 4.4-unit grid. Transparent background.</desc>
  <defs>
    <linearGradient id="casing-rim" x1="0" y1="0" x2="0.65" y2="1">
      <stop stop-color="#bdaca4"/><stop offset=".28" stop-color="#8c7c75"/><stop offset=".67" stop-color="#6d5e59"/><stop offset="1" stop-color="#392f2c"/>
    </linearGradient>
    <linearGradient id="casing-face" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#74665f"/><stop offset=".43" stop-color="#574943"/><stop offset=".72" stop-color="#62514c"/><stop offset="1" stop-color="#5c4c47"/>
    </linearGradient>
    <linearGradient id="rim-glint" x1="0" y1="0" x2="0.7" y2="1">
      <stop stop-color="#e0d2c8" stop-opacity=".45"/><stop offset="1" stop-color="#e0d2c8" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="screen-recess" x1="0" y1="0" x2=".7" y2="1">
      <stop stop-color="#3d302b"/><stop offset=".65" stop-color="#3b2f2b"/><stop offset="1" stop-color="#b29d94"/>
    </linearGradient>
    <linearGradient id="lcd" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c7e3e7"/><stop offset=".55" stop-color="#d9edef"/><stop offset="1" stop-color="#dbeef0"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2=".3">
      <stop stop-color="#39c4ff"/><stop offset=".35" stop-color="#139cfa"/><stop offset=".75" stop-color="#057cde"/><stop offset="1" stop-color="#075ab0"/>
    </linearGradient>
    <linearGradient id="diode" x1="0" y1="0" x2=".2" y2="1">
      <stop stop-color="#74727a"/><stop offset=".25" stop-color="#4c4c57"/><stop offset=".72" stop-color="#2c2e39"/><stop offset="1" stop-color="#181e28"/>
    </linearGradient>
    <linearGradient id="diode-glint" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c2c1c7" stop-opacity=".7"/><stop offset="1" stop-color="#c2c1c7" stop-opacity=".06"/>
    </linearGradient>
    <clipPath id="casing-clip"><rect x="151" y="396" width="910" height="497" rx="78"/></clipPath>
    <clipPath id="lcd-clip"><rect x="453" y="488" width="516" height="313" rx="16"/></clipPath>
  </defs>
  <!-- Rear infrared window, tucked behind the main housing. -->
  <g id="infrared-window">
    <path d="M1054 759H1165C1193 759 1213 779 1213 807S1192 855 1164 855H1054Z" fill="url(#diode)" stroke="#00111f" stroke-width="20" stroke-linejoin="round"/>
