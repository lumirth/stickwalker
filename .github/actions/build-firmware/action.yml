name: Build StickS3 firmware
description: Build the firmware package with the pinned ESP-IDF SDK
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      id: sdk
      with:
        path: .deps
        key: esp-idf-ubuntu-24.04-${{ runner.arch }}-${{ env.IDF_COMMIT }}-esp32s3
    - if: steps.sdk.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p .deps/esp-idf
        git -C .deps/esp-idf init --quiet
        git -C .deps/esp-idf remote add origin https://github.com/espressif/esp-idf.git
        git -C .deps/esp-idf fetch --depth=1 origin "$IDF_COMMIT"
        git -C .deps/esp-idf checkout --detach FETCH_HEAD
        git -C .deps/esp-idf submodule update --init --recursive --depth=1
        IDF_TOOLS_PATH="$PWD/.deps/idf-tools" .deps/esp-idf/install.sh esp32s3
    - shell: bash
      run: |
        tools/build.sh build
        python3 tools/package.py firmware
