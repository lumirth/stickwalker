name: Release packages
on:
  push:
    tags: ['firmware-v*', 'desktop-v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  IDF_COMMIT: fcae32885b0296b32044cb99ecbdc50d98dddb83
jobs:
  firmware:
    if: startsWith(github.ref_name, 'firmware-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check firmware tag
        run: test "$GITHUB_REF_NAME" = "firmware-v$(cat VERSION)"
      - uses: ./.github/actions/build-firmware
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/firmware/*
          retention-days: 7
  desktop_firmware:
    if: startsWith(github.ref_name, 'desktop-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download the matching firmware release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="firmware-v$(cat VERSION)"
          status=$(curl --silent --show-error --retry 3 --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$tag")
          case "$status" in
            200)
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir dist/firmware \
                --pattern firmware.json --pattern bootloader.bin --pattern partition-table.bin --pattern stickwalker.bin
              ;;
            404) echo "missing=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "Firmware release lookup failed (HTTP $status)." >&2; exit 1 ;;
          esac
      - name: Build the bundled firmware for an unpublished version
        if: steps.release.outputs.missing == 'true'
        uses: ./.github/actions/build-firmware
      - name: Verify the firmware before starting desktop builds
        run: python3 tools/package.py check-firmware
      - uses: actions/upload-artifact@v4
        with:
          name: bundled-firmware
          path: dist/firmware/*
          if-no-files-found: error
          retention-days: 1
  desktop:
    needs: desktop_firmware
    if: startsWith(github.ref_name, 'desktop-v')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      STICKWALKER_BUNDLE_FIRMWARE: "1"
      STICKWALKER_UPDATE_KEY: ${{ vars.STICKWALKER_UPDATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: bundled-firmware
          path: dist/firmware
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libasound2-dev libudev-dev libvulkan1 zlib1g-dev
      - name: Check tag and signing configuration
        shell: bash
        env:
          STICKWALKER_SIGN_IDENTITY: ${{ vars.STICKWALKER_SIGN_IDENTITY }}
        run: |
          python tools/package.py check-desktop-release "$GITHUB_REF_NAME"
          rustup toolchain install --profile minimal
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: python e2e/storage.py
      - run: cargo test --locked --workspace
      - if: runner.os == 'macOS'
        name: Import Developer ID and notarization credentials
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: python tools/release.py credentials
      - if: runner.os == 'macOS'
        run: cargo install gpui-updater-release --version 0.4.4 --features cli --locked
      - name: Package
        shell: bash
        env:
          STICKWALKER_SIGN_IDENTITY: ${{ vars.STICKWALKER_SIGN_IDENTITY }}
          STICKWALKER_NOTARY_PROFILE: stickwalker-release
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            python -m venv "$RUNNER_TEMP/dmg-tools"
            "$RUNNER_TEMP/dmg-tools/bin/pip" install -r tools/requirements-macos.txt
            "$RUNNER_TEMP/dmg-tools/bin/python" tools/package.py desktop --sign
          else
            python tools/package.py desktop
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            dist/desktop/*.dmg
            dist/desktop/*.exe
            dist/desktop/*.tar.gz
          retention-days: 7
  draft:
    needs: [firmware, desktop]
    if: ${{ !cancelled() && (needs.firmware.result == 'success' || needs.desktop.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ startsWith(github.ref_name, 'firmware-v') && 'firmware' || 'desktop-*' }}
          merge-multiple: true
          path: artifacts
      - name: Create reviewable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/$TAG.md"
          [[ -f "$notes" ]] || notes=/dev/null
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft); then
            [[ "$draft" == true ]] || { echo "This release is already published."; exit 1; }
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* --verify-tag --draft --title "Stickwalker $TAG" --notes-file "$notes"
          fi
