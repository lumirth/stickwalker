name: Stickwalker firmware E2E
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
env:
  SHARD_COUNT: 5
jobs:
  linux-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-firmware
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-build
          path: |
            stick/.build/e2e-firmware/build-manifest.json
            stick/.build/e2e-firmware/PwStick.ino.bin
            stick/.build/e2e-firmware/PwStick.ino.bootloader.bin
            stick/.build/e2e-firmware/PwStick.ino.elf
            stick/.build/e2e-firmware/PwStick.ino.merged.bin
            stick/.build/e2e-firmware/PwStick.ino.partitions.bin
            stick/.build/e2e-firmware/boot_app0.bin
            stick/.build/simulator/prepared.json
            stick/.build/simulator/target/release/stickwalker-e2e
            stick/.build/simulator/roms/esp32s3_rev0_rom.elf
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  macos-smoke:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-firmware
      - name: Install Tesseract
        run: |
          if ! command -v tesseract >/dev/null; then brew install tesseract; fi
      - name: Check macOS firmware build
        run: uv run python stick/check.py --use-build --use-prepared-simulator --scenario settings --scenario peer-storage
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: macos-smoke-failure
          path: stick/.build/e2e-results/
          include-hidden-files: true
          retention-days: 7

  scenarios:
    needs: linux-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: 1
            first: 1
            second: 2
          - group: 2
            first: 3
            second: 4
          - group: 3
            first: 5
            second: 0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Tesseract
        run: |
          if ! command -v tesseract >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y tesseract-ocr
          fi
      - run: python -m pip install uv==0.12.13
      - run: uv sync --locked
      - uses: actions/download-artifact@v4
        with:
          name: firmware-build
          path: stick/.build
      - name: Run firmware scenarios
        shell: bash
        run: |
          chmod +x stick/.build/simulator/target/release/stickwalker-e2e
          pids=()
          for shard in '${{ matrix.first }}' '${{ matrix.second }}'; do
            if [[ "$shard" == 0 ]]; then continue; fi
            uv run --no-sync python stick/check.py --use-build --use-prepared-simulator \
              --output-dir "stick/.build/e2e-results/shard-$shard" --shard "$shard/$SHARD_COUNT" &
            pids+=("$!")
          done
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          exit "$status"
      - name: Collect scenario summary
        if: always()
        shell: bash
        run: |
          for shard in '${{ matrix.first }}' '${{ matrix.second }}'; do
            directory="stick/.build/e2e-results/shard-$shard"
            if [[ ! -d "$directory" ]]; then continue; fi
            result=$(find "$directory" -name results.json -print -quit)
            if [[ -z "$result" ]]; then continue; fi
            run_directory=$(dirname "$result")
            summary="$RUNNER_TEMP/firmware-summary/shard-$shard"
            mkdir -p "$summary"
            cp "$result" "$summary/results.json"
            for file in "$run_directory/diode-presence/missing.png" \
                        "$run_directory/diode/reversed.png" \
                        "$run_directory/diode-ready/"ready-*.png \
                        "$run_directory/connect/no-peer.png" \
                        "$run_directory/diode/unknown.png" \
                        "$run_directory/connection-details/failed.png"; do
              if [[ -f "$file" ]]; then
                relative=${file#"$run_directory/"}
                mkdir -p "$summary/$(dirname "$relative")"
                cp "$file" "$summary/$relative"
              fi
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-summary-${{ matrix.group }}
          path: ${{ runner.temp }}/firmware-summary/
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-e2e-${{ matrix.group }}
          path: stick/.build/e2e-results/
          include-hidden-files: true
          retention-days: 7

  coverage:
    if: ${{ !cancelled() }}
    needs: scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.13
      - run: uv sync --locked
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-summary-*
          path: ${{ runner.temp }}/firmware-summaries
      - name: Verify complete coverage and build icon preview
        run: uv run python stick/verify_ci_results.py "$RUNNER_TEMP/firmware-summaries" "$RUNNER_TEMP/firmware-atlas" --shards "$SHARD_COUNT"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-margin-atlas
          path: ${{ runner.temp }}/firmware-atlas/
          if-no-files-found: error
          retention-days: 14
