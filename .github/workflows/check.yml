name: Stickwalker firmware E2E
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.5.1'
      - name: Install simulator tools
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y tesseract-ocr
          else
            brew install tesseract
          fi
      - name: Install the firmware SDK
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://static-cdn.m5stack.com/resource/arduino/package_m5stack_index.json
          arduino-cli core update-index
          arduino-cli core install m5stack:esp32@3.3.9
          arduino-cli lib install 'M5GFX@0.2.29'
          arduino-cli lib install --no-deps 'M5Unified@0.2.21'
      - run: python -m pip install uv==0.12.13
      - run: uv sync --locked
      - run: uv run python stick/check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-e2e-${{ matrix.os }}
          path: stick/.build/e2e-results/
          include-hidden-files: true
          retention-days: 14
