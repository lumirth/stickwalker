name: Stickwalker firmware E2E
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
env:
  SHARD_COUNT: 5
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.5.1'
      - name: Install simulator tools
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
      - name: Install the firmware SDK
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://static-cdn.m5stack.com/resource/arduino/package_m5stack_index.json
          arduino-cli core update-index
          arduino-cli core install m5stack:esp32@3.3.9
          arduino-cli lib install 'M5GFX@0.2.29'
          arduino-cli lib install --no-deps 'M5Unified@0.2.21'
      - run: python -m pip install uv==0.12.13
      - run: uv sync --locked
      - name: Build production firmware and simulator
        run: |
          uv run python stick/build_port.py --output-dir stick/.build/e2e-firmware
          uv run python stick/simulation/bootstrap.py
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-build-${{ matrix.os }}
          path: |
            stick/.build/e2e-firmware/build-manifest.json
            stick/.build/e2e-firmware/PwStick.ino.bin
            stick/.build/e2e-firmware/PwStick.ino.bootloader.bin
            stick/.build/e2e-firmware/PwStick.ino.elf
            stick/.build/e2e-firmware/PwStick.ino.merged.bin
            stick/.build/e2e-firmware/PwStick.ino.partitions.bin
            stick/.build/e2e-firmware/boot_app0.bin
            stick/.build/simulator/prepared.json
            stick/.build/simulator/target/release/stickwalker-e2e
            stick/.build/simulator/roms/esp32s3_rev0_rom.elf
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  scenarios:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [1, 2, 3, 4, 5]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Tesseract
        shell: bash
        run: |
          if ! command -v tesseract >/dev/null; then
            if [[ "$RUNNER_OS" == "Linux" ]]; then
              sudo apt-get update
              sudo apt-get install -y tesseract-ocr
            else
              brew install tesseract
            fi
          fi
      - run: python -m pip install uv==0.12.13
      - run: uv sync --locked
      - uses: actions/download-artifact@v4
        with:
          name: firmware-build-${{ matrix.os }}
          path: stick/.build
      - name: Run firmware scenarios
        run: |
          chmod +x stick/.build/simulator/target/release/stickwalker-e2e
          uv run python stick/check.py --use-build --use-prepared-simulator --shard '${{ matrix.shard }}/${{ env.SHARD_COUNT }}'
      - name: Collect scenario summary
        if: always()
        shell: bash
        run: |
          if [[ ! -d stick/.build/e2e-results ]]; then exit 0; fi
          result=$(find stick/.build/e2e-results -name results.json -print -quit)
          if [[ -z "$result" ]]; then exit 0; fi
          run_directory=$(dirname "$result")
          summary="$RUNNER_TEMP/firmware-summary"
          mkdir -p "$summary"
          cp "$result" "$summary/results.json"
          for file in "$run_directory/diode-presence/missing.png" \
                      "$run_directory/diode/reversed.png" \
                      "$run_directory/diode-ready/"ready-*.png \
                      "$run_directory/connect/no-peer.png" \
                      "$run_directory/diode/unknown.png" \
                      "$run_directory/connection-details/failed.png"; do
            if [[ -f "$file" ]]; then
              relative=${file#"$run_directory/"}
              mkdir -p "$summary/$(dirname "$relative")"
              cp "$file" "$summary/$relative"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-summary-${{ matrix.os }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/firmware-summary/
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-e2e-${{ matrix.os }}-${{ matrix.shard }}
          path: stick/.build/e2e-results/
          include-hidden-files: true
          retention-days: 14

  coverage:
    if: ${{ !cancelled() }}
    needs: [build, scenarios]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.13
      - run: uv sync --locked
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-summary-*
          path: ${{ runner.temp }}/firmware-summaries
      - name: Verify complete coverage and build icon previews
        run: uv run python stick/verify_ci_results.py "$RUNNER_TEMP/firmware-summaries" "$RUNNER_TEMP/firmware-atlases" --shards "$SHARD_COUNT"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-margin-atlases
          path: ${{ runner.temp }}/firmware-atlases/
          if-no-files-found: error
          retention-days: 14
