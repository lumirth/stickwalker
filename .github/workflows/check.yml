name: Stickwalker host checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  host:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.13
      - run: uv sync --locked
      - run: uv run python stick/check.py
