name: Bug report
description: Report a Stickwalker problem.
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and result
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Firmware version
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
