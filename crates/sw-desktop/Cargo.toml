[package]
name = "sw-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "stickwalker"
path = "src/main.rs"

[dependencies]
host = { package = "sw-host", path = "../sw-host" }
gpui-kit = "=0.9.1"
anyhow = "1"
color-space = { package = "palette", version = "0.7.6", default-features = false, features = ["std"] }
async-channel = "2"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gpui-updater-core = "=0.4.4"
gpui-updater-sparkle = "=0.4.4"

[build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
gpui-pre = { version = "=0.3.12", features = ["test-support"] }
